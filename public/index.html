<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="polarfavicon.png" type="image/png">
    <title>Polar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="crypto.js"></script>
    <script src="voice.js"></script>
    <script src="app.js"></script>
</head>
<body>
    <div id="app">
        <!-- Auth -->
        <div id="auth-container" class="auth-sky fade-in">
            <div class="auth-inner">
                <div class="auth-north">
                    <img src="polar1.png" alt="Polar Logo" id="auth-logo">
                    <h1 class="auth-wordmark">POLAR</h1>
                </div>

                <div class="card auth-floe">
                    <!-- Login Form -->
                    <form id="login-form">
                        <h2 class="floe-title">Log in</h2>
                        <div class="form-group">
                            <label for="login-username" class="form-label">Username</label>
                            <input type="text" id="login-username" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label for="login-password" class="form-label">Password</label>
                            <input type="password" id="login-password" class="form-input" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-full">Log in</button>
                        <div class="switch-form">
                            <p>Don&rsquo;t have an account? <a href="#" id="switch-to-signup">Sign up</a></p>
                        </div>
                    </form>

                    <!-- Sign Up Form -->
                    <form id="signup-form" class="hide">
                        <h2 class="floe-title">Sign up</h2>
                        <div class="form-group">
                            <label for="signup-fullname" class="form-label">Full name</label>
                            <input type="text" id="signup-fullname" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label for="signup-username" class="form-label">Username</label>
                            <input type="text" id="signup-username" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label for="signup-password" class="form-label">Password</label>
                            <input type="password" id="signup-password" class="form-input" required>
                        </div>
                        <div class="form-group hide" id="signup-code-group">
                            <label for="signup-code" class="form-label">Invite code</label>
                            <input type="text" id="signup-code" class="form-input" autocomplete="off">
                        </div>
                        <div class="form-group">
                            <label for="signup-bio" class="form-label">Bio</label>
                            <textarea id="signup-bio" class="form-input" rows="3"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="signup-avatar" class="form-label">Profile picture URL</label>
                            <input type="text" id="signup-avatar" class="form-input">
                        </div>
                        <button type="submit" class="btn btn-primary w-full">Sign Up</button>
                        <div class="switch-form">
                            <p>Already have an account? <a href="#" id="switch-to-login">Log in</a></p>
                        </div>
                    </form>
                    <p class="floe-note">Keys are generated in this browser.</p>
                </div>
            </div>
        </div>

        <!-- Main -->
        <div id="main-container" class="hide">
            <nav id="meridian" aria-label="Polar">
                <div class="meridian-top">
                    <img src="polar1.png" alt="Polar Logo" id="polar-logo">
                </div>
                <div class="meridian-mid">
                    <button id="rail-admin-button" class="rail-btn hide" title="Admin" aria-label="Admin">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-3.6 8-10V5l-8-3-8 3v7c0 6.4 8 10 8 10z"/><path d="M9 11.5l2 2 4-4"/></svg>
                    </button>
                </div>
                <div class="meridian-bottom">
                    <button id="toggle-theme" class="rail-btn" title="Toggle theme" aria-label="Toggle theme"></button>
                    <button id="logout-button" class="rail-btn" title="Log out" aria-label="Log out">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
                    </button>
                </div>
            </nav>

            <div class="field">
                <header id="sky">
                    <section class="sky-profile">
                        <div class="sky-avatar-wrap">
                            <img id="user-pfp" src="" alt="Profile" class="sky-avatar">
                            <span id="user-status" class="status-indicator status-online"></span>
                        </div>
                        <h2 id="user-name" class="sky-name">Loading...</h2>
                    </section>

                    <section class="sky-constellation">
                        <div id="room-list" class="constellation"></div>
                    </section>

                    <div class="sky-actions">
                        <div class="sky-action">
                            <input id="new-room-name" type="text" class="form-input" placeholder="New room" maxlength="80">
                            <button id="create-room-button" class="btn btn-primary">Create</button>
                        </div>
                        <div class="sky-action">
                            <input id="join-code" type="text" class="form-input" placeholder="Invite code" maxlength="6" style="text-transform: uppercase">
                            <button id="join-room-button" class="btn">Join</button>
                        </div>
                    </div>
                </header>

                <main id="ice">
                    <div class="ice-head">
                        <div class="ice-title-wrap">
                            <h2 id="chat-title" class="ice-title">Chat</h2>
                            <span id="chat-member-count" class="ice-meta"></span>
                            <span id="chat-status" class="ice-meta"></span>
                            <span class="ice-encrypted"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Encrypted</span>
                        </div>
                        <div class="ice-head-right">
                            <span id="invite-code" class="invite-pill"></span>
                            <button id="call-button" class="btn btn-primary">Call</button>
                        </div>
                    </div>
                    <div id="call-bar" class="call-bar hide">
                        <span id="call-participants"></span>
                        <button id="mute-button" class="btn btn-primary">Mute</button>
                        <button id="leave-call-button" class="btn">Leave</button>
                    </div>
                    <div class="members-strip">
                        <div id="member-list" class="members-row"></div>
                        <div class="members-invite">
                            <input id="invite-username" type="text" class="form-input" placeholder="Username">
                            <button id="invite-member-button" class="btn">Add</button>
                            <button id="copy-invite-button" class="btn">
                                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                                <span>Copy code</span>
                            </button>
                        </div>
                    </div>
                    <div id="messages" class="message-container"></div>
                    <div id="typing-indicator" class="typing-indicator">
                        <span id="typing-text"></span>
                        <span class="typing-animation">
                            <span class="typing-dot"></span>
                            <span class="typing-dot"></span>
                            <span class="typing-dot"></span>
                        </span>
                    </div>
                    <div class="composer">
                        <input id="message-input" type="text" placeholder="Message" class="message-input">
                        <button id="send-message" class="btn btn-primary" aria-label="Send message">
                            <span>Send</span>
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-1" viewBox="0 0 20 20" fill="currentColor">
                                <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                            </svg>
                        </button>
                    </div>
                </main>
            </div>

            <!-- Admin -->
            <aside id="admin-panel" class="admin-drawer hide" aria-label="Admin">
                <div class="admin-head">
                    <h3>Admin</h3>
                    <button id="admin-close" class="rail-btn" title="Close admin" aria-label="Close admin">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
                    </button>
                </div>
                <h4 class="admin-subhead">Users</h4>
                <div id="admin-user-list" class="user-list"></div>
                <h4 class="admin-subhead">Rooms</h4>
                <div id="admin-room-list" class="user-list"></div>
            </aside>

            <!-- Notification -->
            <div id="notification" class="notification">
                <span id="notification-message"></span>
            </div>
        </div>
    </div>
</body>
</html>
